name: Verify PR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'up-core-api/**'

permissions:
  contents: read

jobs:
  verify-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up protoc
        uses: SierraSoftworks/setup-protoc@22288b621d6a32dcffc4baf189e88865cdf6aa66 # v3.0.1
        with:
          version: "35.x"
      - name: Generate Java code
        shell: bash
        run: |
          shopt -s globstar
          target_dir="$RUNNER_TEMP/generated-sources/protobuf/java"
          mkdir -p "$target_dir"
          protoc --java_out="$target_dir" --proto_path=./up-core-api up-core-api/**/*.proto
          if [ -z "$(ls -A "$target_dir")" ]; then
            echo "Protoc did not create any Java files"
            exit 1
          fi
